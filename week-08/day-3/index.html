<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Home Run | Baseball game</title>
  <style>
    :root {
      --navy: #12243a;
      --blue: #21496a;
      --red: #c8483f;
      --cream: #f5f0e5;
      --white: #fffdf7;
      --gold: #f1bd54;
      --grass: #4e805d;
      --dirt: #b77950
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--navy);
      font: 16px/1.4 Georgia, serif
    }

    .page {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
      padding: 25px 0 42px
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #cfc4b1;
      padding-bottom: 15px
    }

    .logo {
      font: bold .82rem Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase
    }

    .logo i {
      color: var(--red);
      font-style: normal
    }

    .gameinfo {
      font: 700 .7rem Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #69766f
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      align-items: end;
      padding: 50px 0 28px
    }

    .hero h1 {
      font-size: clamp(3.7rem, 10vw, 8rem);
      line-height: .78;
      letter-spacing: -.08em;
      font-weight: 400;
      margin: 0
    }

    .hero p {
      max-width: 310px;
      margin: 0;
      color: #65736f
    }

    .board {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 1px;
      background: var(--navy);
      border: 4px solid var(--navy);
      color: white;
      font: 700 .8rem Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: .1em
    }

    .board section {
      background: #1c3852;
      padding: 14px 17px
    }

    .board b {
      display: block;
      font-size: 2rem;
      letter-spacing: 0;
      color: var(--gold);
      margin-top: 4px
    }

    .board .count {
      background: #0c1c30
    }

    .count b {
      font-size: 1.25rem;
      color: #fff
    }

    .field {
      position: relative;
      height: clamp(410px, 58vw, 650px);
      margin-top: 22px;
      --base-offset: 18%;
      overflow: hidden;
      perspective: 900px;
      transform-style: preserve-3d;
      border: 2px solid #315b68;
      background: linear-gradient(#86bdca 0 39%, #d5bd83 39% 44%, #477854 44% 100%);
      box-shadow: inset 0 -35px 50px #234b3844
    }

    .field:after {
      content: "";
      position: absolute;
      left: 25%;
      bottom: -47%;
      width: 50%;
      aspect-ratio: 1;
      background: linear-gradient(135deg, #b77c52, #a96748);
      border: 3px solid #d5a36d;
      transform: rotate(45deg) translateZ(-35px);
      box-shadow: inset 0 0 0 14px #a96d4b;
      opacity: .94;
      z-index: 0
    }

    .field>* {
      z-index: 1
    }

    .fence {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 10%;
      height: 27%;
      border: 8px solid #284b59;
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 35% 35% 0 0;
      clip-path: polygon(0 100%, 0 28%, 10% 20%, 21% 25%, 32% 17%, 44% 23%, 56% 15%, 68% 24%, 80% 18%, 91% 25%, 100% 16%, 100% 100%);
      box-shadow: inset 0 12px 0 #d6c78133, 0 7px 0 #183b45;
      transform: translateZ(-65px) rotateX(7deg);
      transform-origin: bottom center;
      opacity: .9
    }

    .fence:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 17%;
      height: 12px;
      background: #396775;
      clip-path: polygon(0 45%, 10% 0, 21% 38%, 32% 0, 44% 34%, 56% 0, 68% 40%, 80% 0, 91% 38%, 100% 0, 100% 100%, 0 100%);
      opacity: .85
    }

    .fence:after {
      content: "OUTFIELD FENCE";
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translateX(-50%);
      color: #d9e2d2;
      font: 700 .58rem Arial, sans-serif;
      letter-spacing: .16em
    }

    .crowd {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 2%;
      height: 17%;
      background:
        radial-gradient(circle at 12% 70%, #e8d6ad 0 3px, #244153 4px 8px, transparent 9px),
        radial-gradient(circle at 24% 48%, #bb735e 0 3px, #183a4c 4px 8px, transparent 9px),
        radial-gradient(circle at 37% 70%, #e5be62 0 3px, #294b59 4px 8px, transparent 9px),
        radial-gradient(circle at 51% 42%, #e6d2a8 0 3px, #183a4c 4px 8px, transparent 9px),
        radial-gradient(circle at 64% 68%, #c66b5c 0 3px, #294b59 4px 8px, transparent 9px),
        radial-gradient(circle at 78% 46%, #e5be62 0 3px, #183a4c 4px 8px, transparent 9px),
        radial-gradient(circle at 91% 70%, #e8d6ad 0 3px, #244153 4px 8px, transparent 9px);
      opacity: .92;
      z-index: 1;
      transform: translateZ(-85px) rotateX(8deg);
      transform-origin: bottom center
    }

    .crowd:after {
      content: "GO ACE!   GO ACE!   GO ACE!";
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      color: #f5e5bb;
      font: 700 .55rem Arial, sans-serif;
      letter-spacing: .12em;
      white-space: nowrap;
      opacity: 0
    }

    .field.homer .crowd {
      animation: crowd-cheer .7s ease-in-out 2
    }

    .field.homer .crowd:after {
      animation: cheer-sign 1.25s ease forwards
    }

    .field.homer .crowd:after {
      content: "TRY HARDER!   TRY HARDER!   TRY HARDER!"
    }

    @keyframes crowd-cheer {
      50% {
        transform: translateY(-7px) scaleY(1.08)
      }
    }

    @keyframes cheer-sign {

      20%,
      85% {
        opacity: 1
      }
    }

    .field:before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -46%;
      width: 75%;
      aspect-ratio: 1;
      border: 3px solid #f2d59d;
      border-radius: 50%;
      transform: translateX(-50%);
      opacity: .8
    }

    .mound {
      position: absolute;
      left: 50%;
      bottom: 40%;
      width: 100px;
      height: 28px;
      background: radial-gradient(ellipse at 45% 35%, #d19a67, #9b6146 74%);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 9px 0 #875841, inset 0 -4px 0 #86533e
    }

    .plate {
      position: absolute;
      left: 50%;
      bottom: 9%;
      width: 34px;
      height: 27px;
      transform: translateX(-50%);
      background: #f5ead0;
      clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%);
      box-shadow: 0 3px 0 #a98564
    }

    .batter-box {
      position: absolute;
      bottom: 8%;
      width: 64px;
      height: 94px;
      border: 2px solid #f5ead0aa;
      background: #f5ead01a;
      box-shadow: inset 0 0 0 1px #7f604b66;
      z-index: 1
    }

    .batter-box.left-box {
      left: calc(50% - 91px)
    }

    .batter-box.right-box {
      left: calc(50% + 27px)
    }

    .base {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #f5ead0;
      border: 2px solid #ad8c6a;
      transform: rotate(45deg);
      box-shadow: 2px 2px 0 #7f604b
    }

    .base.occupied {
      background: var(--gold);
      border-color: #fff2bd;
      box-shadow: 0 0 0 4px #f1bd5466, 2px 2px 0 #7f604b
    }

    .base.occupied:after {
      content: "";
      position: absolute;
      left: 7px;
      top: 3px;
      width: 7px;
      height: 12px;
      border-radius: 5px 5px 2px 2px;
      background: #1d5263;
      transform: rotate(-45deg)
    }

    .base.occupied:before {
      content: "";
      position: absolute;
      left: 6px;
      top: -7px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ba7656;
      border: 1px solid #19384b;
      transform: rotate(-45deg)
    }

    .first-base {
      left: calc(50% + var(--base-offset));
      bottom: 28%
    }

    .second-base {
      left: 50%;
      bottom: 48%;
      transform: translateX(-50%) rotate(45deg)
    }

    .third-base {
      left: calc(50% - var(--base-offset));
      bottom: 28%
    }

    .infielder {
      position: absolute;
      width: 22px;
      height: 44px;
      border-radius: 45% 45% 15% 15%;
      background: linear-gradient(90deg, #173f50, #34706b 48%, #173c4d);
      border: 2px solid #163847;
      box-shadow: 0 4px 0 #203f39, 0 8px 7px #193b3544;
      transform: translateZ(-22px) scale(.72);
      z-index: 2
    }

    .infielder:before {
      content: "";
      position: absolute;
      left: 4px;
      top: -13px;
      width: 10px;
      height: 10px;
      border: 2px solid #163847;
      border-radius: 50%;
      background: #ba7656
    }

    .first-baseman {
      right: 29%;
      bottom: 29%
    }

    .second-baseman {
      right: 39%;
      bottom: 42%
    }

    .shortstop {
      right: 53%;
      bottom: 39%
    }

    .third-baseman {
      right: 61%;
      bottom: 29%
    }

    .fielder {
      position: absolute;
      width: 28px;
      height: 58px;
      border-radius: 45% 45% 15% 15%;
      background: linear-gradient(90deg, #214e4b, #3d7a5c 48%, #1d4948);
      border: 3px solid #183e3f;
      box-shadow: 0 4px 0 #244837, 0 10px 8px #193b3544;
      transform: translateZ(-55px) scale(.82);
      z-index: 1
    }

    .fielder:before {
      content: "";
      position: absolute;
      left: 5px;
      top: -17px;
      width: 13px;
      height: 13px;
      border: 3px solid #183e3f;
      border-radius: 50%;
      background: #315d4e
    }

    .left-field {
      left: 22%;
      top: 28%
    }

    .center-field {
      left: 43%;
      top: 21%
    }

    .right-field {
      right: 20%;
      top: 28%
    }

    .pitcher,
    .batter,
    .catcher {
      position: absolute;
      color: var(--navy)
    }

    .pitcher {
      left: 50%;
      bottom: 41%;
      width: 70px;
      height: 140px;
      transform: translateX(-50%) translateZ(20px);
      z-index: 4
    }

    .batter {
      left: calc(50% + 27px);
      bottom: 10%;
      width: 80px;
      height: 155px;
      z-index: 2
    }

    .batter.batter-left {
      left: auto;
      right: calc(50% + 27px);
      transform: scaleX(-1)
    }

    .catcher {
      left: 50%;
      bottom: 7%;
      width: 75px;
      height: 125px;
      transform: translateX(-50%) translateZ(12px) scale(.82);
      transform-origin: bottom center;
      z-index: 3
    }

    .batter .body {
      background: linear-gradient(90deg, #8f2f2b, var(--red) 48%, #7b2825)
    }

    .person i {
      position: absolute;
      display: block
    }

    .person .head {
      left: 28px;
      top: 0;
      width: 28px;
      height: 28px;
      border: 4px solid currentColor;
      border-radius: 50%;
      background: #ba7656;
      z-index: 2
    }

    .person .head:before {
      content: "";
      position: absolute;
      left: -4px;
      top: -6px;
      width: 29px;
      height: 10px;
      border-radius: 50% 50% 20% 20%;
      background: #19384b;
      border-bottom: 3px solid #102638
    }

    .person .body {
      left: 39px;
      top: 28px;
      width: 18px;
      height: 65px;
      background: linear-gradient(90deg, #193f55, #316c72 48%, #173c52);
      border-radius: 8px 8px 4px 4px;
      transform: translateX(-5px)
    }

    .person .arm {
      left: 40px;
      top: 34px;
      width: 6px;
      height: 58px;
      background: #ba7656;
      transform: rotate(48deg);
      transform-origin: top;
      border-radius: 5px
    }

    .person .arm.two {
      transform: rotate(-48deg)
    }

    .person .leg {
      left: 40px;
      top: 91px;
      width: 9px;
      height: 58px;
      background: #253c4a;
      transform: rotate(25deg);
      transform-origin: top;
      border-radius: 5px
    }

    .person .leg.two {
      transform: rotate(-25deg)
    }

    .pitcher .arm {
      transform: rotate(-70deg)
    }

    .pitcher .arm.two {
      transform: rotate(30deg)
    }

    .batter .bat {
      left: 57px;
      top: 4px;
      width: 7px;
      height: 82px;
      background: linear-gradient(90deg, #5f3827, #b77a42 45%, #5f3827);
      transform: rotate(-48deg);
      transform-origin: bottom center;
      border-radius: 5px
    }

    .batter-left .bat {
      transform: rotate(48deg)
    }

    .batter-left .role {
      transform: scaleX(-1)
    }

    .batter .grip {
      left: 55px;
      top: 76px;
      width: 11px;
      height: 11px;
      background: #ba7656;
      border-radius: 50%;
      z-index: 3
    }

    .batter .grip.two {
      left: 63px;
      top: 79px
    }

    .batter .arm {
      transform: rotate(-65deg)
    }

    .catcher .mask {
      left: 18px;
      top: -2px;
      width: 48px;
      height: 39px;
      border: 3px solid #172f40;
      border-radius: 45%;
      box-shadow: inset 0 0 0 3px #aeb9b0
    }

    .catcher .glove {
      left: 1px;
      top: 48px;
      width: 25px;
      height: 25px;
      border: 5px solid currentColor;
      border-radius: 50%
    }

    .ball {
      position: absolute;
      left: calc(50% - 4px);
      bottom: calc(41% + 70px);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px #162a2d;
      opacity: 0;
      pointer-events: none
    }

    .ball:after {
      content: "";
      position: absolute;
      inset: 1px;
      border-top: 1px solid #d34f4a;
      border-bottom: 1px solid #d34f4a;
      border-radius: 50%;
      transform: rotate(35deg)
    }

    .field.throwing .ball {
      opacity: 1;
      animation: throw 1s ease-in forwards
    }

    .field.missed .ball {
      opacity: 0;
      animation: none
    }

    .field.hitting-pitch .ball {
      opacity: 1;
      animation: hitting-pitch var(--pitch-speed, 1s) linear forwards
    }

    .field.hit .ball {
      opacity: 1;
      animation: home-run 1.25s cubic-bezier(.18, .7, .3, 1) forwards
    }

    .field.hit.single .ball {
      animation: base-hit 1.05s ease-out forwards
    }

    .field.hit.double .ball {
      animation: double-hit 1.1s ease-out forwards
    }

    .field.hit.triple .ball {
      animation: triple-hit 1.15s ease-out forwards
    }

    .field.hit .batter {
      animation: none
    }

    .field.hit .batter .bat {
      animation: swing .45s ease
    }

    .field.hit .batter-left .bat {
      animation-name: swing-left
    }

    .field.throwing .pitcher .arm {
      animation: pitch-arm .55s ease
    }

    .field.out .ball {
      opacity: 1;
      animation: throw 1s ease-in forwards
    }

    @keyframes throw {
      to {
        left: calc(50% - 4px);
        bottom: calc(9% + 10px);
        transform: scale(.7)
      }
    }

    @keyframes hitting-pitch {
      0% {
        left: calc(50% - 4px);
        bottom: calc(41% + 70px);
        transform: scale(1.1)
      }

      100% {
        left: calc(50% - 4px);
        bottom: calc(9% + 10px);
        transform: scale(.7)
      }
    }

    @keyframes home-run {
      0% {
        left: calc(50% + 20px);
        bottom: calc(50% + 51px)
      }

      42% {
        left: 70%;
        bottom: 57%;
        transform: scale(.85)
      }

      100% {
        left: 94%;
        bottom: 91%;
        transform: scale(.45)
      }
    }

    @keyframes base-hit {
      to {
        left: 80%;
        bottom: 34%;
        transform: scale(.7)
      }
    }

    @keyframes double-hit {
      55% {
        left: 78%;
        bottom: 58%;
        transform: scale(.75)
      }

      100% {
        left: 86%;
        bottom: 50%;
        transform: scale(.62)
      }
    }

    @keyframes triple-hit {
      55% {
        left: 75%;
        bottom: 69%;
        transform: scale(.7)
      }

      100% {
        left: 90%;
        bottom: 76%;
        transform: scale(.5)
      }
    }

    @keyframes swing {
      50% {
        transform: rotate(-18deg)
      }
    }

    @keyframes swing-left {
      50% {
        transform: rotate(18deg)
      }
    }

    @keyframes pitch-arm {
      50% {
        transform: rotate(-8deg)
      }
    }

    .role {
      position: absolute;
      bottom: 5px;
      font: 700 .62rem Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #e8e4d5;
      background: #18384dce;
      padding: 4px 7px
    }

    .pitcher .role {
      left: -10px
    }

    .batter .role {
      right: 0;
      background: var(--red)
    }

    .catcher .role {
      left: -5px
    }

    .pitcher .body {
      background: linear-gradient(90deg, #173b68, var(--blue) 48%, #122c52)
    }

    .pitcher .role {
      left: -10px;
      background: var(--blue)
    }

    .controls {
      margin-top: 22px;
      background: var(--white);
      padding: 19px;
      border: 1px solid #d5c8b2
    }

    .controls h2 {
      font-size: 1.25rem;
      font-weight: 400;
      margin: 0 0 3px
    }

    .controls p {
      margin: 0;
      color: #68756f;
      font-size: .9rem
    }

    .pitches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      margin-top: 16px
    }

    .controls.hitting-mode .pitch:not(:first-child) {
      display: none
    }

    .pitch {
      border: 2px solid var(--blue);
      background: #fff;
      color: var(--blue);
      padding: 13px 9px;
      cursor: pointer;
      font: bold .8rem Arial, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .pitch:hover,
    .pitch:focus {
      background: var(--blue);
      color: #fff
    }

    .pitch:disabled {
      opacity: .45;
      cursor: wait
    }

    .pitch small {
      display: block;
      font: normal .78rem Georgia, serif;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 3px
    }

    .result {
      min-height: 25px;
      margin: 16px 0 0;
      font-weight: bold;
      color: var(--blue)
    }

    .result.hit {
      color: #ab453b
    }

    .result.strike {
      color: #987018
    }

    @media(max-width:650px) {
      .hero {
        display: block;
        padding-top: 45px
      }

      .hero p {
        margin-top: 22px
      }

      .board {
        grid-template-columns: 1fr 1fr
      }

      .board .count {
        grid-column: span 2
      }

      .pitches {
        grid-template-columns: 1fr
      }

      .pitcher {
        bottom: 41%
      }

      .batter {
        left: calc(50% + 27px);
        right: auto;
        bottom: 9%;
        transform: scale(.82);
        transform-origin: bottom right
      }

      .batter.batter-left {
        left: auto;
        right: calc(50% + 27px);
        transform: scaleX(-1) scale(.82)
      }

      .catcher {
        left: 50%;
        bottom: 6%;
        transform: translateX(-50%) scale(.72);
        transform-origin: bottom center
      }

    }
  </style>
</head>

<body>
  <main class="page">
    <header class="top">
      <div class="logo">The <i>Home Run</i></div>
      <div class="gameinfo" id="gameInfo">Top of the 1st / 3 innings</div>
    </header>
    <section class="hero">
      <h1>The Home Run</h1>
      <p>You are the red hitter. Watch the blue pitcher and swing when the ball reaches the plate.
      </p>
    </section>
    <section class="board">
      <section><span>Home</span><b id="home">00</b></section>
      <section class="count"><span>Count</span><b><span id="balls">0</span> - <span id="strikes">0</span></b><small
          class="outs">0 OUTS</small></section>
      <section><span>Away</span><b id="away">00</b></section>
    </section>
    <section class="field" id="field" aria-label="Baseball field with pitcher, batter, and catcher">
      <div class="crowd" aria-label="baseball crowd"></div>
      <div class="fence"></div>
      <div class="mound"></div>
      <div class="plate" aria-label="home plate"></div>
      <div class="batter-box left-box" aria-label="left batter's box"></div>
      <div class="batter-box right-box" aria-label="right batter's box"></div>
      <div class="base first-base" id="firstBase" aria-label="first base"></div>
      <div class="base second-base" id="secondBase" aria-label="second base"></div>
      <div class="base third-base" id="thirdBase" aria-label="third base"></div>
      <div class="fielder left-field" aria-label="left fielder"></div>
      <div class="fielder center-field" aria-label="center fielder"></div>
      <div class="fielder right-field" aria-label="right fielder"></div>
      <div class="infielder first-baseman" aria-label="first baseman"></div>
      <div class="infielder second-baseman" aria-label="second baseman"></div>
      <div class="infielder shortstop" aria-label="shortstop"></div>
      <div class="infielder third-baseman" aria-label="third baseman"></div>
      <div class="ball"></div>
      <div class="person pitcher"><i class="head"></i><i class="body"></i><i class="arm"></i><i class="arm two"></i><i
          class="leg"></i><i class="leg two"></i><span class="role">Computer pitcher</span></div>
      <div class="person batter batter-right"><i class="head"></i><i class="body"></i><i class="arm"></i><i
          class="arm two"></i><i class="leg"></i><i class="leg two"></i><i class="grip"></i><i class="grip two"></i><i
          class="bat"></i><span class="role">You</span></div>
      <div class="person catcher"><i class="head"></i><i class="body"></i><i class="arm"></i><i class="arm two"></i><i
          class="leg"></i><i class="leg two"></i><i class="mask"></i><i class="glove"></i><span
          class="role">Catcher</span></div>
    </section>
    <section class="controls hitting-mode">
      <h2 id="controlTitle">Hitting mode</h2>
      <p id="controlPrompt">Swing when the pitch reaches the plate.</p>
      <div class="pitches"><button class="pitch" data-pitch="Swing">Swing<small>make contact</small></button><button
          class="pitch" data-pitch="Curveball">Curveball<small>slows the hitter</small></button><button class="pitch"
          data-pitch="Changeup">Changeup<small>slows the hitter</small></button></div>
      <p class="result" id="result" aria-live="polite">Select a pitch to begin.</p>
    </section>
  </main>
  <script>
    (function () {
      var field = document.getElementById("field");
      var result = document.getElementById("result");
      var buttons = document.querySelectorAll(".pitch");
      var balls = document.getElementById("balls");
      var strikes = document.getElementById("strikes");
      var outs = document.querySelector(".outs");
      var home = document.getElementById("home");
      var away = document.getElementById("away");
      var batter = document.querySelector(".batter");
      var controls = document.querySelector(".controls");
      var controlTitle = document.getElementById("controlTitle");
      var controlPrompt = document.getElementById("controlPrompt");
      var gameInfo = document.getElementById("gameInfo");
      var baseElements = [document.getElementById("firstBase"), document.getElementById("secondBase"), document.getElementById("thirdBase")];
      var runners = [false, false, false];
      var ballCount = 0, strikeCount = 0, outCount = 0, homeScore = 0, awayScore = 0, inning = 1, locked = false, batterSide = "right", hittingMode = true, pitchInFlight = false, pitchStartedAt = 0, currentPitch = null, gameOver = false;
      var pitchTypes = [
        { name: "Fastball", duration: 700, window: [570, 770] },
        { name: "Curveball", duration: 950, window: [760, 1020] },
        { name: "Changeup", duration: 1200, window: [980, 1270] }
      ];

      function syncFieldGeometry() {
        if (!field.clientWidth || !field.clientHeight) return;
        var aspectRatio = field.clientWidth / field.clientHeight;
        var baseOffset = Math.max(15, Math.min(21, aspectRatio * 10));
        field.style.setProperty("--base-offset", baseOffset + "%");
      }

      syncFieldGeometry();
      window.addEventListener("resize", syncFieldGeometry);

      function switchBatterBox() {
        batterSide = batterSide === "right" ? "left" : "right";
        batter.classList.toggle("batter-right", batterSide === "right");
        batter.classList.toggle("batter-left", batterSide === "left");
      }

      function enterHittingMode() {
        hittingMode = true;
        controls.classList.add("hitting-mode");
        controlTitle.textContent = "Hitting mode";
        controlPrompt.textContent = "Swing at the pitch to chase the home run.";
        buttons[0].firstChild.nodeValue = "Swing";
        buttons[0].querySelector("small").textContent = "make contact";
        buttons[0].dataset.pitch = "Swing";
      }

      function updateInningLabel() {
        gameInfo.textContent = "Top of the " + inning + (inning === 1 ? "st" : inning === 2 ? "nd" : "rd") + " / 3 innings";
      }

      function startPitch() {
        currentPitch = pitchTypes[Math.floor(Math.random() * pitchTypes.length)];
        pitchStartedAt = performance.now();
        pitchInFlight = true;
        field.style.setProperty("--pitch-speed", currentPitch.duration + "ms");
        field.className = "field hitting-pitch";
        result.className = "result";
        result.textContent = currentPitch.name + " coming in. Swing when it reaches the plate.";
      }

      function resetCount() {
        ballCount = 0;
        strikeCount = 0;
        balls.textContent = "0";
        strikes.textContent = "0";
      }

      function drawBases() {
        baseElements.forEach(function (base, index) {
          base.classList.toggle("occupied", runners[index]);
        });
      }

      function resetInning() {
        runners = [false, false, false];
        outCount = 0;
        outs.textContent = "0 OUTS";
        resetCount();
        drawBases();
      }

      function finishHalfInning() {
        var computerRuns = Math.floor(Math.random() * 3);
        awayScore += computerRuns;
        away.textContent = String(awayScore).padStart(2, "0");
        if (inning === 3) {
          gameOver = true;
          result.textContent = "Three full innings complete. Final score recorded.";
          controlPrompt.textContent = "The game is over.";
          setButtons(true);
          return;
        }
        inning++;
        resetInning();
        updateInningLabel();
        result.textContent = computerRuns ? "The computer scores " + computerRuns + " in the bottom half. Your turn." : "The computer is retired in the bottom half. Your turn.";
      }

      function setButtons(value) {
        buttons.forEach(function (button) { button.disabled = value; });
      }

      function scoreRuns(number) {
        homeScore += number;
        home.textContent = String(homeScore).padStart(2, "0");
      }

      function advanceRunners(hitType) {
        var next = [false, false, false];
        var runs = 0;
        if (hitType === "single") {
          if (runners[2]) runs++;
          next[2] = runners[1];
          next[1] = runners[0];
          next[0] = true;
        }
        if (hitType === "double") {
          runs = (runners[1] ? 1 : 0) + (runners[2] ? 1 : 0);
          next[2] = runners[0];
          next[1] = true;
        }
        if (hitType === "triple") {
          runs = runners.filter(Boolean).length;
          next[2] = true;
        }
        if (hitType === "homer") {
          runs = runners.filter(Boolean).length + 1;
        }
        scoreRuns(runs);
        runners = next;
        drawBases();
      }

      buttons.forEach(function (button) {
        button.addEventListener("click", function () {
          if (locked || gameOver) return;

          if (hittingMode && !pitchInFlight) {
            startPitch();
            return;
          }

          locked = true;
          setButtons(true);
          var pitch = currentPitch.name;
          var timing = performance.now() - pitchStartedAt;
          var hit = timing >= currentPitch.window[0] && timing <= currentPitch.window[1];
          pitchInFlight = false;
          pitchStartedAt = 0;
          currentPitch = null;
          var hitType = "";
          if (hit) {
            var distance = Math.random();
            hitType = distance < .5 ? "single" : distance < .75 ? "double" : distance < .9 ? "triple" : "homer";
          }
          field.className = "field " + (hit ? "hit " + hitType : "missed");
          result.className = "result";
          if (hit) {
            advanceRunners(hitType);
            resetCount();
            result.className = "result hit";
            result.textContent = hitType === "homer" ? "Home run! The crowd shouts: Try harder!" : "A " + hitType + " puts runners on base.";
            switchBatterBox();
          } else {
            strikeCount++;
            strikes.textContent = strikeCount;
            result.className = "result strike";
            result.textContent = pitch + "! Strike " + strikeCount + ".";
            if (strikeCount === 3) {
              outCount++;
              outs.textContent = outCount + (outCount === 1 ? " OUT" : " OUTS");
              resetCount();
              switchBatterBox();
              if (outCount === 3) {
                finishHalfInning();
              } else {
                result.textContent = "Strike three! Out " + outCount + ".";
              }
            }
          }
          setTimeout(function () {
            field.className = "field";
            if (!gameOver) {
              locked = false;
              setButtons(false);
            }
          }, hitType === "homer" ? 1450 : 1250);
        });
      });
      enterHittingMode();
      updateInningLabel();
    }());
  </script>
</body>

</html>
